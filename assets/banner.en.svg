<title id="t">CF ImgHub — Image hosting for personal blogs</title>
<desc id="d">CF ImgHub banner: title and a button group reading Fast, Local compression, Live · HDR; the large maple-and-cloud logo on the right</desc>
<style>
.seg-on,.seg-off{animation:7.2s infinite}
.seg-on{animation-name:on;transform-box:fill-box;transform-origin:center}
.seg-off{animation-name:off}
@keyframes on{0%{opacity:0;transform:scale(.94)}2.5%{opacity:1;transform:scale(1.03);animation-timing-function:cubic-bezier(.3,0,.2,1)}9%{transform:scale(1)}32%{opacity:1}34.5%,100%{opacity:0;transform:scale(1)}}
@keyframes off{0%{opacity:1}2.5%,32%{opacity:0}34.5%,100%{opacity:1}}
.turn{transform-box:fill-box;transform-origin:center;animation:turn 90s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.up{animation:up 3.2s infinite}
@keyframes up{0%,55%{transform:translateY(0)}68%{transform:translateY(-3px);animation-timing-function:cubic-bezier(.3,0,.2,1)}80%{transform:translateY(.6px)}90%,100%{transform:translateY(0)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px) rotate(-1.5deg)}to{transform:translateY(5px) rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.seg-on{opacity:0}}
</style>
